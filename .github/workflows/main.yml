name: Build CallAI Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate or extract project files
        run: |
          # إذا وُجد ملف zip في المستودع فك ضغطه
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project
          fi

          # البحث عن المجلد الذي يحتوي على gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "./.github/*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew was not found anywhere in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Using project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare environment file
        run: |
          if [ -f "$PROJECT_DIR/.env.example" ] && [ ! -f "$PROJECT_DIR/.env" ]; then
            cp "$PROJECT_DIR/.env.example" "$PROJECT_DIR/.env"
          fi

      - name: Grant execute permission for gradlew
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Print Actual APK SHA-1
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            keytool -printcert -jarfile "$APK_PATH" | grep -i "SHA1:"
          else
            echo "APK file not found."
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callai-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          
